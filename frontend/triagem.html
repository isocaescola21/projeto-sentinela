<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .btn-tv{
    background-color: #28a745;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }

  .btn-tv:hover { background-color: #1e7e34; }
  .pacientes-fila{
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;
  }

  .pacientes-fila h3 {
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
}

  .pacientes-fila h3 span{
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }

  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #dce4ff;
  }

  .fila-item strong { font-size: 15px; }
  .fila-item small { color: #888; font-size: 12px;}
  .btn-abrir-tv {
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }

  .btn-abrir-tv:hover { background: #117a8b; }

</style>
</head>

<body>
<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>🏥 Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da TV</button>
  </div>

  <div class="paciente-fila">
    <h3>Paciente Cadastrados no Atendimento
      <span>Clique em "Chamas na TV" para chamar ao guichê</span>
    </h3>
    <div id="fila-pacientes">
      <p style="color: #888; text-align: center;">Carregando...</p>
    </div>
    <button onclick="carregandoPacientes()" style="margin-top: 8px; background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">🔄️ Atualizando lista</button>
  </div>


<div class="container">


<img src="logo.png" class="logo-img">


<h1>Triagem Hospitalar</h1>


<p class="subtitulo">
Avaliação inicial e classificação de risco do paciente.
</p>



<h2>Paciente</h2>

<input
    type="text"
    id="paciente"
    name="paciente"
    placeholder="Digite o nome do paciente"
    required
>


<h2>Sintoma principal</h2>


<select id="sintoma">


<option value="">
Selecione o sintoma
</option>


<option value="dor_leve">
Dor leve
</option>


<option value="resfriado">
Resfriado
</option>


<option value="coriza">
Coriza
</option>


<option value="tosse">
Tosse
</option>


<option value="febre">
Febre
</option>


<option value="vomito">
Vômito
</option>


<option value="diarreia">
Diarreia
</option>


<option value="falta_ar_moderada">
Falta de ar moderada
</option>


<option value="falta_ar_grave">
Falta de ar grave
</option>


<option value="infarto">
Suspeita de infarto
</option>


<option value="avc">
Suspeita de AVC
</option>


<option value="convulsao">
Convulsão
</option>


<option value="hemorragia">
Hemorragia
</option>


</select>





<input 
id="temp"
type="number"
placeholder="Temperatura (°C)">





<input 
id="alergia"
placeholder="Alergias">





<textarea 
id="observacao"
placeholder="Observações adicionais">
</textarea>




<div id="resultado"></div>



<button onclick="salvar()">

Salvar Triagem

</button>



</div>





<script>


let pacientes = [];



// ==========================
// CARREGAR PACIENTES
// ==========================


async function carregarPacientes() {
    try {
        const resposta = await fetch("/pacientes-triagem");

        if (!resposta.ok) {
            throw new Error("Erro ao buscar pacientes");
        }

        const pacientes = await resposta.json();

        console.log("Pacientes recebidos:", pacientes);

        const select = document.getElementById("paciente");

        select.innerHTML = `
            <option value="">Selecione o paciente</option>
        `;

        pacientes.forEach(paciente => {
            const option = document.createElement("option");

            option.value = paciente.id;
            option.textContent = paciente.nome;

            select.appendChild(option);
        });

    } catch (erro) {
        console.error("Erro ao carregar pacientes:", erro);
    }
}

carregarPacientes();




// ==========================
// CLASSIFICAR RISCO
// ==========================

function classificarRisco(sintoma, temperatura) {

    temperatura = Number(temperatura);

    // EMERGÊNCIA
    if (temperatura >= 40) {
        return "vermelho";
    }

    // MUITO URGENTE
    if (temperatura >= 39) {
        return "laranja";
    }

    // URGENTE
    if (temperatura >= 38) {
        return "amarelo";
    }

    // POUCO URGENTE
    return "verde";
}


// ==========================
// SALVAR TRIAGEM
// ==========================

async function salvar() {

    const id = document.getElementById("paciente").value;
    const sintoma = document.getElementById("sintoma").value;
    const temperatura = document.getElementById("temp").value;
    const alergia = document.getElementById("alergia").value;
    const observacao = document.getElementById("observacao").value;


    // ==========================
    // VALIDAÇÕES
    // ==========================

    if (id === "") {
        alert("Selecione o paciente.");
        return;
    }

    if (sintoma === "") {
        alert("Selecione o sintoma.");
        return;
    }

    if (temperatura === "") {
        alert("Informe a temperatura.");
        return;
    }


    // ==========================
    // CONVERTER TEMPERATURA
    // ==========================

    const temperaturaNumero = Number(temperatura);

    if (isNaN(temperaturaNumero)) {
        alert("Informe uma temperatura válida.");
        return;
    }


    // ==========================
    // CLASSIFICAR RISCO
    // ==========================

    const risco = classificarRisco(
        sintoma,
        temperaturaNumero
    );


    // ==========================
    // ENVIAR PARA O SERVIDOR
    // ==========================

    try {

        const resposta = await fetch("/triagem", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                id: id,

                sintomas: sintoma,

                temperatura: temperaturaNumero,

                alergia: alergia,

                observacao: observacao,

                risco: risco

            })

        });


        // ==========================
        // VERIFICAR RESPOSTA
        // ==========================

        if (!resposta.ok) {

            throw new Error(
                "Erro ao salvar a triagem."
            );

        }


        const dados = await resposta.json();

        console.log(
            "Triagem salva:",
            dados
        );


        // ==========================
        // MOSTRAR RESULTADO
        // ==========================

        alert(
            "Triagem salva com sucesso!"
        );


        const resultado =
            document.getElementById("resultado");


        if (resultado) {

            resultado.innerHTML =
                "Classificação: " +
                risco.toUpperCase();

        }


        // ==========================
        // IR PARA MÉDICO
        // ==========================

        setTimeout(() => {

            window.location.href =
                "medico.html";

        }, 1000);


    } catch (erro) {

        console.error(
            "Erro:",
            erro
        );

        alert(
            "Erro ao conectar com o servidor."
        );

    }

}


// ==========================
// GARANTIR QUE O BOTÃO
// ENCONTRE A FUNÇÃO
// ==========================

window.salvar = salvar;


// ==========================
// CARREGAR PACIENTES
// ==========================

carregarPacientes();
  
</script>


</body>

</html>
