<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Vida Plena - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container login-container">

        <img src="logo.png" alt="Hospital Vida Plena" class="logo">

        <div class="login-card">

            <h2>Acesso ao Sistema</h2>

            <input
                type="text"
                id="usuario"
                placeholder="Usuário">

            <input
                type="password"
                id="senha"
                placeholder="Senha">

            <button onclick="login()">
                Entrar
            </button>

        </div>

    </div>

    <script>

function login(){


    const usuario = document.getElementById("usuario").value;

    const senha = document.getElementById("senha").value;



    fetch("http://localhost:3000/login", {


        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            usuario: usuario,

            senha: senha

        })


    })


    .then(async resposta => {


        const dados = await resposta.json();



        console.log(dados); // TESTE



        if(!resposta.ok){


            alert(dados.erro);

            return;

        }



        if(dados.tipo === "medico"){


            window.location.href = "./medico.html";


        }


        else if(dados.tipo === "triagem"){


            window.location.href = "./triagem.html";


        }


        else if(dados.tipo === "atendimento"){


            window.location.href = "./atendimento.html";


        }


        else{


            alert("Tipo de usuário não encontrado.");

        }



    })


    .catch(erro=>{


        console.log(erro);

        alert("Erro ao conectar com o servidor");


    });



}


</script>

</body>

</html>
